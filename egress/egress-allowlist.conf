# egress-allowlist.conf — L2 egress allowlist (host-side, default-deny)
#
# One hostname per line. Lines starting with '.' match that domain AND all
# its subdomains (Squid dstdomain ACL semantics). Everything not listed here
# is REFUSED by the CONNECT-only proxy. Changes require host access (outside
# the sandbox) and are deliberate, audited, committed to the Agent-Stack repo.
#
# Sources: spec-l2-egress-proxy-2026-08-05.md §4 (initial policy, expected to grow)
# Added: 2026-08-15 (v1.11)

