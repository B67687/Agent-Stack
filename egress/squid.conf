# squid.conf — L2 egress allowlist proxy (host-side, CONNECT-only)
#
# TEMPLATE: ${HOME} placeholders are substituted by scripts/egress-proxy.sh
# (envsubst) into a runtime conf at ~/.cache/opencode/egress/squid.runtime.conf
# so the committed file stays portable (no absolute user paths).
#
# Runs as the invoking user (systemd user unit egress-proxy@.service), listens
# ONLY on loopback, and REFUSES everything not in egress-allowlist.conf.
# Topology: Anthropic sandbox-runtime pattern (host proxy + socat Unix-socket
# bridge into the bwrap netns). Policy semantics: Codex network-proxy
# (deny-wins, allowlist-only). See spec-l2-egress-proxy-2026-08-05.md.
#
# Writable state (pid/log/cache) lives under ~/.cache/opencode/egress/ so the
# proxy runs fine as a non-root user. Added: 2026-08-15 (v1.11).

# --- Listen: loopback only, non-default port (avoid 3128 clashes) ---
http_port 127.0.0.1:13128

# --- No caching (pure CONNECT/forward gate) ---
cache deny all
cache_dir ufs ${HOME}/.cache/opencode/egress/cache 100 16 256
coredump_dir ${HOME}/.cache/opencode/egress

# --- Logs (writable as user) ---
access_log ${HOME}/.cache/opencode/egress/access.log
cache_log ${HOME}/.cache/opencode/egress/cache.log
pid_filename ${HOME}/.cache/opencode/egress/squid.pid

# --- ACLs ---
acl loopback_src src 127.0.0.1
acl SSL_ports port 443
acl CONNECT method CONNECT
acl allowed_dst dstdomain "${HOME}/.config/opencode/egress/egress-allowlist.conf"

# --- Policy (deny-wins) ---
http_access deny !loopback_src
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_dst
http_access allow allowed_dst
http_access deny all
